<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminus: Interactive Linux Journey & Wargame</title>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-green: #2ea043;
            --accent-cyan: #58a6ff;
            --accent-purple: #bc8cff;
            --accent-yellow: #d29922;
            --accent-red: #f85149;
            --term-bg: #05070a;
            --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        #sidebar {
            width: 340px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-header h1 {
            font-size: 1.15rem;
            color: #f0f6fc;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .progress-bar-container {
            margin-top: 14px;
            background-color: var(--bg-tertiary);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            background-color: var(--accent-green);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .nav-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            list-style: none;
        }

        .nav-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 10px 10px 4px 10px;
            letter-spacing: 0.05em;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-main);
            transition: background 0.15s ease;
        }

        .nav-item:hover {
            background-color: var(--bg-tertiary);
        }

        .nav-item.active {
            background-color: #1f6feb26;
            color: var(--accent-cyan);
            border-left: 3px solid var(--accent-cyan);
        }

        .nav-item.completed::after {
            content: "✓";
            color: var(--accent-green);
            font-weight: bold;
        }

        /* Main Content Layout */
        #workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #lesson-panel {
            flex: 1;
            overflow-y: auto;
            padding: 28px;
            border-bottom: 2px solid var(--border-color);
            background: var(--bg-primary);
        }

        .lesson-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .lesson-tag {
            font-size: 0.7rem;
            text-transform: uppercase;
            padding: 2px 8px;
            border-radius: 12px;
            background: var(--bg-tertiary);
            color: var(--accent-cyan);
            font-weight: bold;
            display: inline-block;
            margin-bottom: 8px;
        }

        .lesson-title {
            font-size: 1.5rem;
            color: #f0f6fc;
        }

        .lesson-body h3 {
            margin: 18px 0 8px 0;
            font-size: 1.05rem;
            color: var(--accent-cyan);
        }

        .lesson-body p {
            margin-bottom: 12px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .lesson-body code {
            font-family: var(--font-mono);
            background-color: var(--bg-tertiary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #f0883e;
        }

        .lesson-body pre {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 12px 0;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #79c0ff;
        }

        .objective-box {
            background-color: #1f6feb14;
            border-left: 4px solid var(--accent-cyan);
            padding: 14px;
            margin: 20px 0;
            border-radius: 0 6px 6px 0;
        }

        .objective-box h4 {
            color: var(--accent-cyan);
            font-size: 0.9rem;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Terminal Emulator Panel */
        #terminal-panel {
            height: 380px;
            background-color: var(--term-bg);
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--border-color);
        }

        .term-header {
            background-color: var(--bg-secondary);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-family: var(--font-mono);
        }

        .term-controls {
            display: flex;
            gap: 6px;
        }

        .term-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .term-dot.red { background-color: #ff5f56; }
        .term-dot.yellow { background-color: #ffbd2e; }
        .term-dot.green { background-color: #27c93f; }

        #term-output {
            flex: 1;
            padding: 12px 16px;
            overflow-y: auto;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: #d1d5db;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .term-line {
            margin-bottom: 4px;
            line-height: 1.4;
        }

        .term-line.stdout { color: #c9d1d9; }
        .term-line.stderr { color: var(--accent-red); }
        .term-line.prompt { color: var(--accent-cyan); }
        .term-line.success { color: var(--accent-green); font-weight: bold; }

        #term-input-row {
            display: flex;
            align-items: center;
            padding: 8px 16px;
            background-color: var(--term-bg);
            border-top: 1px solid #161b22;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        .prompt-label {
            color: var(--accent-green);
            margin-right: 8px;
            font-weight: bold;
            white-space: nowrap;
        }

        #term-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f6fc;
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        /* Utilities / Footer */
        .app-footer-actions {
            padding: 12px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .btn-action {
            flex: 1;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background-color: #30363d;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <div class="sidebar-header">
            <h1><span>⚡</span> Terminus Linux</h1>
            <div class="progress-bar-container">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <div class="progress-stats">
                <span id="progress-pct">0% Complete</span>
                <span id="progress-count">0/10 Done</span>
            </div>
        </div>

        <ul class="nav-list" id="nav-list">
            <!-- Dynamically Rendered -->
        </ul>

        <div class="app-footer-actions">
            <button class="btn-action" onclick="exportProgress()">Backup Data</button>
            <button class="btn-action" onclick="resetProgress()">Reset All</button>
        </div>
    </aside>

    <main id="workspace">
        <section id="lesson-panel">
            <div class="lesson-header">
                <span class="lesson-tag" id="lesson-module">Module</span>
                <h2 class="lesson-title" id="lesson-title">Loading Lesson...</h2>
            </div>
            <div class="lesson-body" id="lesson-content">
                <!-- Content injected via JS -->
            </div>
            <div class="objective-box">
                <h4>Interactive Lab Objective</h4>
                <div id="lesson-objective">Loading challenge parameters...</div>
            </div>
        </section>

        <section id="terminal-panel" onclick="document.getElementById('term-input').focus()">
            <div class="term-header">
                <div class="term-controls">
                    <div class="term-dot red"></div>
                    <div class="term-dot yellow"></div>
                    <div class="term-dot green"></div>
                </div>
                <span>virtual-terminal: sam@kali:~</span>
                <span>bash 5.2</span>
            </div>
            <div id="term-output"></div>
            <div id="term-input-row">
                <span class="prompt-label" id="term-prompt">sam@kali:~$</span>
                <input type="text" id="term-input" autocomplete="off" spellcheck="false" autofocus>
            </div>
        </section>
    </main>

    <script>
        /* ==========================================================
           Curriculum Data: Linux Journey Basics + OverTheWire Labs
           ========================================================== */
        const curriculum = [
            {
                id: "mod-1",
                section: "Linux Journey: The Shell",
                title: "1. Navigation & Inspection (pwd, ls, cd)",
                tag: "Fundamentals",
                content: `
                    <p>The Linux filesystem is organized as a single hierarchical tree, starting at the root directory <code>/</code>. Unlike Windows, there are no drive letters (e.g., <code>C:\\</code>).</p>
                    <h3>Core Navigation Commands:</h3>
                    <ul>
                        <li><code>pwd</code> (Print Working Directory): Outputs the full path of your current location.</li>
                        <li><code>ls</code> (List): Lists files and folders. Adding <code>-la</code> shows hidden files (files beginning with a dot) along with permissions and sizes.</li>
                        <li><code>cd &lt;path&gt;</code> (Change Directory): Moves into a specified directory. Use <code>cd ..</code> to step back one folder level.</li>
                    </ul>
                `,
                objective: "Inspect your current directory, list all files including hidden ones using <code>ls -la</code>, and change into the <code>projects</code> directory.",
                validator: (cmd, term) => {
                    if (cmd.trim() === "ls -la" || cmd.trim() === "ls -al") {
                        term.flags.sawHidden = true;
                    }
                    if (cmd.trim() === "cd projects" && term.flags.sawHidden) {
                        return true;
                    }
                    return false;
                }
            },
            {
                id: "mod-2",
                section: "Linux Journey: The Shell",
                title: "2. File Inspection & Viewers (cat, less, head, tail)",
                tag: "Fundamentals",
                content: `
                    <p>Linux treats almost everything as a file, including system configurations and logs. Reading contents without opening a heavy text editor is an essential skill.</p>
                    <h3>Reading Utilities:</h3>
                    <ul>
                        <li><code>cat &lt;file&gt;</code>: Dumps the entire contents of a file directly into the terminal window.</li>
                        <li><code>head -n &lt;N&gt; &lt;file&gt;</code>: Prints the first N lines of a file (default is 10).</li>
                        <li><code>tail -n &lt;N&gt; &lt;file&gt;</code>: Prints the last N lines of a file.</li>
                    </ul>
                `,
                objective: "Inspect the file <code>/etc/network/interfaces</code> using <code>cat /etc/network/interfaces</code> to inspect the network adapters.",
                validator: (cmd) => cmd.trim() === "cat /etc/network/interfaces"
            },
            {
                id: "mod-3",
                section: "OverTheWire: Bandit Labs",
                title: "3. Bandit 0-1: Hidden Tokens & Spaces",
                tag: "OTW Challenge",
                content: `
                    <p>In real-world forensics and penetration testing, target files often include unusual characters, leading hyphens, or spaces designed to break standard shell parsing.</p>
                    <p>To inspect a filename containing spaces, you must wrap the filename in quotation marks or escape the space with a backslash:</p>
                    <pre>cat "spaces in this filename"<br>cat spaces\\ in\\ this\\ filename</pre>
                `,
                objective: "Find the credential token hidden inside the file named <code>pass with spaces.txt</code> in your home directory.",
                validator: (cmd) => {
                    const clean = cmd.trim();
                    return clean === 'cat "pass with spaces.txt"' || clean === "cat pass\\ with\\ spaces.txt" || clean === "cat 'pass with spaces.txt'";
                }
            },
            {
                id: "mod-4",
                section: "Linux Journey: Text Manipulation",
                title: "4. Standard Streams & Redirection (>, >>, |)",
                tag: "Piping & I/O",
                content: `
                    <p>Programs run with three standard I/O channels: <b>stdin (0)</b>, <b>stdout (1)</b>, and <b>stderr (2)</b>.</p>
                    <ul>
                        <li><code>&gt;</code> redirects stdout to a file, completely overwriting its prior contents.</li>
                        <li><code>&gt;&gt;</code> appends stdout to the bottom of an existing file.</li>
                        <li><code>|</code> (pipe) sends the standard output of the command on the left into the input of the command on the right.</li>
                    </ul>
                `,
                objective: "Write the text <code>managed=true</code> into <code>/etc/NetworkManager/NetworkManager.conf</code> using redirection (<code>echo \"managed=true\" &gt; /etc/NetworkManager/NetworkManager.conf</code>).",
                validator: (cmd) => {
                    const clean = cmd.trim().replace(/\s+/g, ' ');
                    return clean === 'echo "managed=true" > /etc/NetworkManager/NetworkManager.conf' ||
                           clean === "echo 'managed=true' > /etc/NetworkManager/NetworkManager.conf";
                }
            },
            {
                id: "mod-5",
                section: "OverTheWire: Bandit Labs",
                title: "5. Bandit 2-3: Searching & The Find Utility",
                tag: "OTW Challenge",
                content: `
                    <p>When searching an entire operating system for a specific file, manual directory traversal is ineffective. The <code>find</code> command searches directory trees based on arbitrary criteria.</p>
                    <pre>find /path -type f -name "*.conf"<br>find /var -size +1M</pre>
                `,
                objective: "Search the <code>/var</code> directory for files matching the name <code>secret.token</code> using: <code>find /var -name secret.token</code>.",
                validator: (cmd) => cmd.trim() === "find /var -name secret.token" || cmd.trim() === 'find /var -name "secret.token"'
            },
            {
                id: "mod-6",
                section: "Linux Journey: Permissions",
                title: "6. Permissions & Ownership (chmod, chown)",
                tag: "Security",
                content: `
                    <p>Every file on Linux has an owner, an assigned group, and three permission scopes:</p>
                    <ul>
                        <li><b>r (read = 4)</b>, <b>w (write = 2)</b>, <b>x (execute = 1)</b></li>
                        <li>User / Group / Others. For example: <code>chmod 700 &lt;file&gt;</code> provides read/write/execute strictly to the owner and no permissions to anyone else.</li>
                    </ul>
                `,
                objective: "Lock down the permissions of <code>id_rsa</code> so that only the owner can read and write it (<code>chmod 600 id_rsa</code>).",
                validator: (cmd) => cmd.trim() === "chmod 600 id_rsa" || cmd.trim() === "chmod u=rw,go= id_rsa"
            },
            {
                id: "mod-7",
                section: "OverTheWire: Bandit Labs",
                title: "7. Bandit 4-5: Data Filtering (grep, sort, uniq)",
                tag: "OTW Challenge",
                content: `
                    <p>A classic sysadmin and CTF scenario involves isolating a single unique string out of millions of lines of noisy data.</p>
                    <ul>
                        <li><code>grep &lt;pattern&gt;</code>: Matches and extracts specific substrings.</li>
                        <li><code>sort</code>: Sorts incoming data lines alphabetically or numerically.</li>
                        <li><code>uniq -u</code>: Isolates and prints lines that occur exactly once.</li>
                    </ul>
                `,
                objective: "Sort the file <code>data.txt</code> and print only the unique line using piping: <code>sort data.txt | uniq -u</code>.",
                validator: (cmd) => cmd.trim() === "sort data.txt | uniq -u"
            },
            {
                id: "mod-8",
                section: "Linux Journey: Packages & Services",
                title: "8. Process Management & Systemd",
                tag: "Administration",
                content: `
                    <p>Modern Linux distributions use <code>systemd</code> to initialize the userland environment and manage system services.</p
